name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_CACHE_DIR: .turbo/cache
  # On a pull request, a turbo task runs only when the pull request changes one of its inputs:
  # nothing else can change its result, and main's own run checks every merged state in full.
  TURBO_AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
  TURBO_TELEMETRY_DISABLED: 1

# The jobs run `check`, `test`, `test:bun`, `test:workerd` and the release baseline guard:
# the two test jobs split the workspace with `--filter=@checkfu/domain` and its negation.
jobs:
  # Generated files, format, lint and every package's typecheck, on one runner.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck
      # Each check runs even when one before it fails, so a run lists every failure.
      - run: bun run generate:check
      - if: ${{ !cancelled() }}
        run: bun run format:check
      - if: ${{ !cancelled() }}
        run: bun run lint
      - if: ${{ !cancelled() }}
        run: bun run persisted:check
      - if: ${{ !cancelled() }}
        run: bun run typecheck
      - if: ${{ !cancelled() }}
        name: Fail if a check changed any tracked file
        run: git diff --exit-code

  # Each package's tests already use Vitest workers, so packages that share a runner run one at a
  # time. The heaviest get runners of their own; the last leg is every package the others leave out.
  test-packages:
    name: test (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: api
            filter: --filter=@checkfu/api
          - name: cli
            filter: --filter=@checkfu/cli --filter=@checkfu/release
          - name: rest
            filter: --filter=!@checkfu/domain --filter=!@checkfu/api --filter=!@checkfu/cli --filter=!@checkfu/release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test-${{ matrix.leg.name }}
      - run: bun x turbo run test $TURBO_AFFECTED --continue --concurrency=1 ${{ matrix.leg.filter }}
      - if: ${{ !cancelled() && matrix.leg.name == 'api' }}
        run: bun run test:bun
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The required check includes both package tests and complete journey evidence.
  test:
    needs: [test-packages, verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$PACKAGES" = success && test "$JOURNEYS" = success
        env:
          PACKAGES: ${{ needs.test-packages.result }}
          JOURNEYS: ${{ needs.verification.result }}

  # Long Z3 proofs get their own runners. The other domain files share one, in parallel.
  domain-proofs:
    name: domain (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: rest
            args: --exclude test/Checkfu.verify.test.ts --exclude test/Checkfu.story.test.ts --exclude test/EnsureTurnStarted.test.ts --exclude test/Sessions.verify.test.ts --exclude test/Sessions.replay.verify.test.ts --exclude test/AutomationRuns.verify.test.ts
          - name: sessions
            args: test/Sessions.verify.test.ts
          - name: sessions-replay
            args: test/Sessions.replay.verify.test.ts
          - name: automation-runs
            args: test/AutomationRuns.verify.test.ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain-${{ matrix.shard.name }}
      - run: bun x turbo run test $TURBO_AFFECTED --filter=@checkfu/domain -- ${{ matrix.shard.args }}
        env:
          CHECKFU_PROVE: "1"
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The required check: it passes only when every domain-proofs shard passed.
  domain:
    needs: domain-proofs
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.domain-proofs.result }}

  # The unified Checkfu proof alone takes about ten minutes, so it runs beside the other proofs.
  domain-checkfu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain-checkfu
      - run: bun x turbo run test $TURBO_AFFECTED --filter=@checkfu/domain -- test/Checkfu.verify.test.ts test/Checkfu.story.test.ts test/EnsureTurnStarted.test.ts
        env:
          CHECKFU_PROVE: "1"
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # Builds the image of the sessions' machines and runs them under the runner's Docker.
  # Each PiSession file starts one Alchemy stack for its tests and runs on a runner of its own,
  # and so does the sandbox contract, which starts a machine for each clause.
  # Every other workerd file shares one more.
  workerd-tests:
    name: workerd (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: pi-session
            evidence: project
          - name: pi-session-machines
            evidence: machines
          - name: sandboxes
            evidence: ""
            args: test/workerd/Sandboxes.workerd.ts
          - name: rest
            evidence: ""
            args: --exclude test/workerd/PiSession.workerd.ts --exclude test/workerd/PiSessionMachines.workerd.ts --exclude test/workerd/Sandboxes.workerd.ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - if: matrix.leg.evidence == ''
        run: bun run test:workerd ${{ matrix.leg.args }}
        env:
          CHECKFU_LOG_DOCKER_READINESS: "1"
      - if: matrix.leg.evidence != ''
        run: bun run verify "${{ matrix.leg.evidence }}" --full
        env:
          CHECKFU_VERIFICATION_DIR: .checkfu/verification
          CHECKFU_LOG_DOCKER_READINESS: "1"
      - if: ${{ always() && matrix.leg.evidence != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.leg.evidence }}
          path: .checkfu/verification/
          include-hidden-files: true
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The required check: it passes only when every workerd leg passed.
  workerd:
    needs: workerd-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.workerd-tests.result }}

  # Fresh executions retain provenance; Turbo's log cache is not evidence for a new SHA.
  acceptance-evidence:
    name: journeys (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [clients, ui, browser, mcp, api, domain]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - if: matrix.group == 'browser'
        name: Build dashboard and locate Chrome
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          bun run --cwd apps/app build
      - run: bun run verify ${{ matrix.group }}
        env:
          CHECKFU_VERIFICATION_DIR: .checkfu/verification
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.group }}
          path: .checkfu/verification/
          include-hidden-files: true

  verification:
    needs: [acceptance-evidence, workerd-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verification-*
          path: .checkfu/results
      - name: Derive the feature matrix from executed cases
        shell: bash
        run: |
          mapfile -t reports < <(find .checkfu/results -type f -regextype posix-extended -regex '.*/(clients|ui|browser|mcp|api|project|machines|domain)\.json' | sort)
          bun run verify report "${reports[@]}"
        env:
          CHECKFU_VERIFICATION_DIR: .checkfu/verification
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-matrix
          path: .checkfu/verification/
          include-hidden-files: true
      - if: ${{ always() }}
        name: Require the evidence producers to pass
        run: test "$JOURNEYS_RESULT" = success && test "$WORKERD_RESULT" = success
        env:
          JOURNEYS_RESULT: ${{ needs.acceptance-evidence.result }}
          WORKERD_RESULT: ${{ needs.workerd-tests.result }}

  # A deployable main includes its sandbox image. This is independent of npm CLI versions.
  cli-platforms:
    uses: ./.github/workflows/npm-packages.yml

  sandbox-image:
    if: github.event_name == 'push'
    concurrency:
      group: sandbox-image-publication
      queue: max
    needs: [static, test, domain, domain-checkfu, workerd, cli-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Identify the sandbox build context
        id: image
        run: echo "tag=$(bun apps/cli/scripts/Image.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the sandbox only when its build context changes
        env:
          IMAGE: ghcr.io/checkfu/sandbox:${{ steps.image.outputs.tag }}
          SANDBOX_TAG: ${{ steps.image.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          available="$(bun --no-env-file apps/cli/scripts/SandboxPublication.ts "$SANDBOX_TAG")"
          if [[ "$available" == missing ]]; then
            docker build --platform linux/amd64 \
              --label org.opencontainers.image.source=https://github.com/checkfu/checkfu \
              --tag "$IMAGE" apps/api/src/Sandbox/image
            docker push "$IMAGE"
          fi
