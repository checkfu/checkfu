name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1

# The jobs together run exactly what `bun run check`, `test`, `test:bun` and `test:workerd` run:
# the two test jobs split the workspace with `--filter=@checkfu/domain` and its negation.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each check runs even when one before it fails, so a run lists every failure.
      - run: bun run generate:check
      - if: ${{ !cancelled() }}
        run: bun run format:check
      - if: ${{ !cancelled() }}
        run: bun run lint
      - if: ${{ !cancelled() }}
        name: Fail if a check changed any tracked file
        run: git diff --exit-code

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck
      - run: bun run typecheck
      - if: ${{ !cancelled() }}
        name: Fail if the typecheck changed any tracked file
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test
      - run: bun x turbo run test --continue --filter='!@checkfu/domain'
      - if: ${{ !cancelled() }}
        run: bun run test:bun
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The Z3 proofs in packages/domain take minutes, so they get a runner of their own.
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain
      - run: bun x turbo run test --filter=@checkfu/domain -- --exclude test/Checkfu.verify.test.ts
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The unified Checkfu proof alone takes about ten minutes, so it runs beside the other proofs.
  domain-checkfu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain-checkfu
      - run: bun x turbo run test --filter=@checkfu/domain -- test/Checkfu.verify.test.ts
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test:workerd
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code
