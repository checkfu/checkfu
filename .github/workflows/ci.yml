name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Let main's proofs finish and save reusable results while new commits arrive.
  # A newer main push replaces the pending run; PR updates cancel the running one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1

# The jobs run `check`, `test`, `test:bun`, `test:workerd` and the release baseline guard:
# the two test jobs split the workspace with `--filter=@checkfu/domain` and its negation.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each check runs even when one before it fails, so a run lists every failure.
      - run: bun run generate:check
      - if: ${{ !cancelled() }}
        run: bun run format:check
      - if: ${{ !cancelled() }}
        run: bun run lint
      - if: ${{ !cancelled() }}
        run: bun run persisted:check
      - if: ${{ !cancelled() }}
        name: Fail if a check changed any tracked file
        run: git diff --exit-code

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck
      - run: bun run typecheck
      - if: ${{ !cancelled() }}
        name: Fail if the typecheck changed any tracked file
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test
      - run: bun x turbo run test --continue --filter='!@checkfu/domain'
      - if: ${{ !cancelled() }}
        run: bun run test:bun
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The Z3 proofs in packages/domain take minutes, so they get a runner of their own.
  domain:
    runs-on: ubuntu-latest
    # Allow the fault-exhaustive Sessions proof and the other serial proofs to finish.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain
      # Concurrent solver-heavy files can starve the Sessions proof.
      - run: bun x turbo run test --filter=@checkfu/domain -- --exclude test/Checkfu.verify.test.ts --no-file-parallelism
        env:
          CHECKFU_PROVE: "1"
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The unified Checkfu proof alone takes about ten minutes, so it runs beside the other proofs.
  domain-checkfu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain-checkfu
      - run: bun x turbo run test --filter=@checkfu/domain -- test/Checkfu.verify.test.ts
        env:
          CHECKFU_PROVE: "1"
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # Builds the image of the sessions' machines and runs them under the runner's Docker.
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test:workerd
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code
