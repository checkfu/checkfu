name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Let main's proofs finish and save reusable results while new commits arrive.
  # A newer main push replaces the pending run; PR updates cancel the running one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1

# The jobs run `check`, `test`, `test:bun`, `test:workerd` and the release baseline guard:
# the two test jobs split the workspace with `--filter=@checkfu/domain` and its negation.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each check runs even when one before it fails, so a run lists every failure.
      - run: bun run generate:check
      - if: ${{ !cancelled() }}
        run: bun run format:check
      - if: ${{ !cancelled() }}
        run: bun run lint
      - if: ${{ !cancelled() }}
        run: bun run persisted:check
      - if: ${{ !cancelled() }}
        name: Fail if a check changed any tracked file
        run: git diff --exit-code

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck
      - run: bun run typecheck
      - if: ${{ !cancelled() }}
        name: Fail if the typecheck changed any tracked file
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test
      # Each package already uses Vitest workers. Competing package runners can
      # starve large-payload and streaming checks on this runner.
      - run: bun x turbo run test --continue --filter='!@checkfu/domain' --concurrency=1
      - if: ${{ !cancelled() }}
        run: bun run test:bun
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # Long Z3 proofs get their own runners. The other domain files share one, in parallel.
  domain-proofs:
    name: domain (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: rest
            args: --exclude test/Checkfu.verify.test.ts --exclude test/Sessions.verify.test.ts --exclude test/Sessions.replay.verify.test.ts --exclude test/AutomationRuns.verify.test.ts
          - name: sessions
            args: test/Sessions.verify.test.ts
          - name: sessions-replay
            args: test/Sessions.replay.verify.test.ts
          - name: automation-runs
            args: test/AutomationRuns.verify.test.ts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain-${{ matrix.shard.name }}
      - run: bun x turbo run test --filter=@checkfu/domain -- ${{ matrix.shard.args }}
        env:
          CHECKFU_PROVE: "1"
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The required check: it passes only when every domain-proofs shard passed.
  domain:
    needs: domain-proofs
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.domain-proofs.result }}

  # The unified Checkfu proof alone takes about ten minutes, so it runs beside the other proofs.
  domain-checkfu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: domain-checkfu
      - run: bun x turbo run test --filter=@checkfu/domain -- test/Checkfu.verify.test.ts
        env:
          CHECKFU_PROVE: "1"
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # Builds the image of the sessions' machines and runs them under the runner's Docker.
  # PiSession.workerd.ts, whose tests share one Alchemy stack, runs on a runner of its own,
  # and every other workerd file on another.
  workerd-tests:
    name: workerd (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: pi-session
            args: test/workerd/PiSession.workerd.ts
          - name: rest
            args: --exclude test/workerd/PiSession.workerd.ts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test:workerd ${{ matrix.leg.args }}
      - if: ${{ !cancelled() }}
        name: Fail if a test changed any tracked file
        run: git diff --exit-code

  # The required check: it passes only when both workerd legs passed.
  workerd:
    needs: workerd-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.workerd-tests.result }}

  # A deployable main includes its sandbox image. This is independent of npm CLI versions.
  cli-platforms:
    uses: ./.github/workflows/npm-packages.yml

  sandbox-image:
    if: github.event_name == 'push'
    needs: [static, typecheck, test, domain, domain-checkfu, workerd, cli-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Identify the sandbox build context
        id: image
        run: echo "tag=$(bun apps/cli/scripts/Image.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the sandbox only when its build context changes
        env:
          IMAGE: ghcr.io/checkfu/sandbox:${{ steps.image.outputs.tag }}
        run: |
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            docker build --platform linux/amd64 \
              --label org.opencontainers.image.source=https://github.com/checkfu/checkfu \
              --tag "$IMAGE" apps/api/src/Sandbox/image
            docker push "$IMAGE"
          fi
