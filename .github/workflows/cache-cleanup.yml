name: Delete a closed pull request's caches

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for id in $(gh cache list --ref "$REF" --limit 1000 --json id --jq '.[].id'); do
            gh cache delete "$id"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
