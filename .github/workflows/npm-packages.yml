name: npm packages

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "apps/api/**"
      - "apps/mcp/**"
      - "packages/**"
      - "tools/release/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "LICENSE"
      - ".github/workflows/npm-packages.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: npm-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --cwd tools/release test
      - run: git diff --exit-code
