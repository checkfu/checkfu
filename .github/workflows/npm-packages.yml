name: npm packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      record-integrity: ${{ steps.pack.outputs.record-integrity }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Build one package candidate
        id: pack
        shell: bash
        run: |
          bun run release:build --prepare "$RUNNER_TEMP/checkfu-npm" | tee "$RUNNER_TEMP/checkfu-pack.log"
          integrity="$(sed -n 's/^Candidate record integrity: //p' "$RUNNER_TEMP/checkfu-pack.log")"
          [[ "$integrity" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]]
          echo "record-integrity=$integrity" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/checkfu-npm/
          if-no-files-found: error
          overwrite: true

  node22:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.0.0", "22"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Record the consumer Node executable
        run: |
          node --version
          echo "CHECKFU_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/checkfu-npm/
      - name: Exercise the shared candidate
        env:
          RECORD_INTEGRITY: ${{ needs.candidate.outputs.record-integrity }}
        run: bun run release:build --qualify-prepared "$RUNNER_TEMP/checkfu-npm" "$RECORD_INTEGRITY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-receipt-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/checkfu-npm/qualified.json
          if-no-files-found: error
          overwrite: true

  qualified:
    needs: [candidate, node22]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/checkfu-npm/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-receipt-*
          path: ${{ runner.temp }}/checkfu-npm-receipts/
      - name: Require identical verified bytes on every consumer
        env:
          RECORD_INTEGRITY: ${{ needs.candidate.outputs.record-integrity }}
        shell: bash
        run: |
          packages="$RUNNER_TEMP/checkfu-npm"
          for os in ubuntu-latest macos-latest; do
            for version in 22.0.0 22; do
              cmp "$packages/candidates.json" "$RUNNER_TEMP/checkfu-npm-receipts/npm-receipt-$os-$version/qualified.json"
            done
          done
          set -o noclobber
          cat "$packages/candidates.json" > "$packages/qualified.json"
          bun run release:build --verify "$packages" "$RECORD_INTEGRITY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-qualified
          path: ${{ runner.temp }}/checkfu-npm/
          if-no-files-found: error
          overwrite: true
