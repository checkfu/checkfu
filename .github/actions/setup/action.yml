name: Set up
description: Install Bun, Node and dependencies, and restore the turbo cache for one job.

inputs:
  turbo-cache:
    description: >-
      The turbo cache this job restores and saves, for a job that runs turbo. A pull request
      restores its own latest entry first, so a restacked or re-pushed PR replays every task
      whose inputs did not change; otherwise it restores main's.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - id: node
      uses: actions/setup-node@v5
      with:
        node-version: 24

    # Only main saves the Bun cache: a pull request's cache can be read by that pull request alone,
    # and each copy is about 460 MB of the repository's 10 GB. A pull request restores main's.
    - id: bun-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash

    - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}

    - if: ${{ inputs.turbo-cache != '' }}
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-bun-${{ steps.bun.outputs.bun-version }}-${{ github.sha }}
        restore-keys: turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-bun-${{ steps.bun.outputs.bun-version }}-
