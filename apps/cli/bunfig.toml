# Bun configuration for the CLI when it is started explicitly, from any directory:
#
#   bun --no-env-file --config=<checkout>/apps/cli/bunfig.toml <checkout>/apps/cli/src/main.ts
#
# `--no-env-file` keeps that directory's .env out; this file pins the config so its
# bunfig.toml and preloads are not read. The default `bun checkfu` does not use this file.
preload = []
