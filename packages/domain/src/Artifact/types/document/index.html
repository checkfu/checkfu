<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Document</title>
	<style>
		:root {
			color-scheme: light dark;
		}
		body {
			margin: 0;
			font:
				17px/1.6 system-ui,
				sans-serif;
		}
		a {
			color: inherit;
		}
		pre {
			overflow: auto;
			padding: 12px;
			border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
			border-radius: 6px;
		}
		code {
			font:
				0.9em ui-monospace,
				monospace;
		}
		img {
			max-width: 100%;
		}
		blockquote {
			margin: 0;
			padding-left: 16px;
			border-left: 3px solid color-mix(in srgb, currentColor 30%, transparent);
		}
		main {
			max-width: 720px;
			margin: 0 auto;
			padding: 48px 20px;
		}
	</style>
	<main id="content">Loading…</main>
	<script id="markdown">
		globalThis.renderMarkdown = (text) => {
			const escape = (value) =>
				value
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;")
			const safe = (url) => {
				const lower = url.trim().toLowerCase()
				return lower.includes(":") &&
					!lower.startsWith("http:") &&
					!lower.startsWith("https:") &&
					!lower.startsWith("mailto:")
					? "#"
					: url.trim()
			}
			const inlinePattern =
				/`([^`]+)`|!\[([^\]]*)\]\(([^)\s]+)\)|\[([^\]]+)\]\(([^)\s]+)\)|\*\*([^*]+)\*\*|\*([^*]+)\*/g
			const inline = (value) => {
				let result = ""
				let offset = 0
				for (const match of value.matchAll(inlinePattern)) {
					result += escape(value.slice(offset, match.index))
					const [token, code, alt, source, label, href, strong, emphasis] = match
					if (code !== undefined) {
						result += "<code>" + escape(code) + "</code>"
					} else if (source !== undefined) {
						result += '<img alt="' + escape(alt) + '" src="' + escape(safe(source)) + '">'
					} else if (href !== undefined) {
						result += '<a href="' + escape(safe(href)) + '">' + inline(label) + "</a>"
					} else if (strong !== undefined) {
						result += "<strong>" + inline(strong) + "</strong>"
					} else {
						result += "<em>" + inline(emphasis) + "</em>"
					}
					offset = match.index + token.length
				}
				return result + escape(value.slice(offset))
			}
			const out = []
			let paragraph = []
			let list = null
			let code = null
			const flush = () => {
				if (paragraph.length > 0) {
					out.push("<p>" + inline(paragraph.join(" ")) + "</p>")
					paragraph = []
				}
				if (list !== null) {
					out.push(
						"<" +
							list.tag +
							">" +
							list.items.map((item) => "<li>" + inline(item) + "</li>").join("") +
							"</" +
							list.tag +
							">",
					)
					list = null
				}
			}
			for (const line of text.replaceAll("\r\n", "\n").split("\n")) {
				if (code !== null) {
					if (line.startsWith("```")) {
						out.push("<pre><code>" + escape(code.join("\n")) + "</code></pre>")
						code = null
					} else {
						code.push(line)
					}
					continue
				}
				if (line.startsWith("```")) {
					flush()
					code = []
					continue
				}
				const heading = /^(#{1,6})\s+(.*)$/.exec(line)
				const bullet = /^\s*[-*]\s+(.*)$/.exec(line)
				const numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line)
				if (heading !== null) {
					flush()
					out.push(
						"<h" + heading[1].length + ">" + inline(heading[2]) + "</h" + heading[1].length + ">",
					)
				} else if (line.trim() === "***") {
					flush()
					out.push("<hr>")
				} else if (line.startsWith(">")) {
					flush()
					out.push("<blockquote>" + inline(line.slice(1).trim()) + "</blockquote>")
				} else if (bullet !== null || numbered !== null) {
					const tag = bullet !== null ? "ul" : "ol"
					if (paragraph.length > 0 || (list !== null && list.tag !== tag)) {
						flush()
					}
					list = list ?? { tag, items: [] }
					list.items.push((bullet ?? numbered)[1])
				} else if (line.trim() === "") {
					flush()
				} else {
					if (list !== null) {
						flush()
					}
					paragraph.push(line.trim())
				}
			}
			if (code !== null) {
				out.push("<pre><code>" + escape(code.join("\n")) + "</code></pre>")
			}
			flush()
			return out.join("\n")
		}
	</script>
	<script>
		fetch("content.md")
			.then((response) =>
				response.ok ? response.text() : Promise.reject(new Error("content.md is missing")),
			)
			.then((text) => {
				const content = document.getElementById("content")
				content.innerHTML = renderMarkdown(text)
				const title = content.querySelector("h1")
				if (title !== null) {
					document.title = title.textContent
				}
			})
			.catch((error) => {
				document.getElementById("content").textContent = error.message
			})
	</script>
</html>
